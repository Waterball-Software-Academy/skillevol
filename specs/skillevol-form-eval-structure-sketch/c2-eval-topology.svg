<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"
     font-family="'JetBrains Mono','SF Mono','Menlo','Consolas','PingFang TC','Microsoft JhengHei',monospace">
  <defs>
    <marker id="ink" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 L3,5.5 Z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="960" fill="#fbfaf7"/>

  <text x="36" y="42" font-size="28" font-weight="700" fill="#2b2b2b">c2-eval-topology</text>
  <text x="36" y="70" font-size="15" fill="#7a756c">focus: canonical eval package splits into shared, dev/holdout, and scenario shapes</text>

  <rect x="28" y="100" width="1384" height="250" rx="14" fill="none" stroke="#bdb8ad" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="48" y="126" font-size="16" font-weight="700" fill="#8a857a">Eval package</text>
  <rect x="28" y="380" width="1384" height="360" rx="14" fill="none" stroke="#bdb8ad" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="48" y="406" font-size="16" font-weight="700" fill="#8a857a">Scenario and oracle consumers</text>

  <rect x="90" y="150" width="400" height="150" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="112" y="182" font-size="22" font-weight="700" fill="#2b2b2b">eval/</text>
  <rect x="112" y="208" width="356" height="28" rx="8" fill="#f6f3ec" stroke="#d8d2c7"/>
  <text x="126" y="227" font-size="13" fill="#2b2b2b">shared/expect.md</text>
  <rect x="112" y="244" width="170" height="28" rx="8" fill="#f6f3ec" stroke="#d8d2c7"/>
  <text x="126" y="263" font-size="13" fill="#2b2b2b">dev/&lt;scenario&gt;+</text>
  <rect x="298" y="244" width="170" height="28" rx="8" fill="#f6f3ec" stroke="#d8d2c7"/>
  <text x="312" y="263" font-size="13" fill="#2b2b2b">holdout/&lt;scenario&gt;*</text>
  <rect x="112" y="278" width="220" height="22" rx="6" fill="#f0ede6"/>
  <text x="122" y="293" font-size="12" fill="#8a857a">unit: rules/structure.md#eval</text>

  <rect x="140" y="470" width="320" height="155" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="162" y="500" font-size="20" font-weight="700" fill="#2b2b2b">non-branch scenario</text>
  <text x="162" y="532" font-size="13" fill="#2b2b2b">before/</text>
  <text x="162" y="554" font-size="13" fill="#2b2b2b">prompt.md</text>
  <text x="162" y="576" font-size="13" fill="#2b2b2b">user.md?  expect.md  after/?</text>
  <rect x="162" y="596" width="250" height="22" rx="6" fill="#f0ede6"/>
  <text x="172" y="611" font-size="12" fill="#8a857a">unit: rules/structure.md#non-branch-scenario</text>

  <rect x="530" y="470" width="320" height="155" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="552" y="500" font-size="20" font-weight="700" fill="#2b2b2b">branch scenario</text>
  <text x="552" y="532" font-size="13" fill="#2b2b2b">before/</text>
  <text x="552" y="554" font-size="13" fill="#2b2b2b">prompt.md</text>
  <text x="552" y="576" font-size="13" fill="#2b2b2b">variants/&lt;unit-name&gt;+</text>
  <rect x="552" y="596" width="230" height="22" rx="6" fill="#f0ede6"/>
  <text x="562" y="611" font-size="12" fill="#8a857a">unit: rules/structure.md#branch-scenario</text>

  <text x="914" y="490" font-size="16" fill="#8a857a">consumer</text>
  <rect x="890" y="470" width="360" height="155" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="914" y="500" font-size="20" font-weight="700" fill="#2b2b2b">runner / judge</text>
  <text x="914" y="534" font-size="13" fill="#2b2b2b">reads shared expect</text>
  <text x="914" y="556" font-size="13" fill="#2b2b2b">reads unit expect and after diff</text>
  <text x="914" y="578" font-size="13" fill="#2b2b2b">keeps hidden oracle off visible input</text>
  <rect x="914" y="596" width="250" height="22" rx="6" fill="#f0ede6"/>
  <text x="924" y="611" font-size="12" fill="#8a857a">unit: rules/structure.md#artifact-output-contract</text>

  <path d="M290,300 L290,470" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="302" y="390" font-size="12" fill="#2b2b2b">materialize unit</text>
  <path d="M420,300 L620,470" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="470" y="390" font-size="12" fill="#2b2b2b">materialize branch</text>
  <path d="M490,220 L890,220" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="630" y="208" font-size="12" fill="#2b2b2b">shared expect</text>
  <path d="M460,550 L890,550" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="620" y="538" font-size="12" fill="#2b2b2b">expect plus after diff</text>

  <rect x="540" y="126" width="360" height="54" rx="10" fill="#eaf1f8" stroke="#2471a3"/>
  <text x="556" y="147" font-size="13" fill="#1b4f72">shared/expect.md is the cross-cut contract.</text>
  <text x="556" y="165" font-size="13" fill="#1b4f72">dev and holdout differ only by visibility.</text>
  <path d="M720,180 L720,208" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="44" y="652" width="390" height="60" rx="10" fill="#fbeee2" stroke="#d35400"/>
  <text x="60" y="674" font-size="13" fill="#a04000">A non-branch directory is already one unit.</text>
  <text x="60" y="692" font-size="13" fill="#a04000">before/prompt/expect are required.</text>
  <path d="M238,652 L238,625" stroke="#d35400" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="480" y="652" width="330" height="60" rx="10" fill="#eaf1f8" stroke="#2471a3"/>
  <text x="496" y="674" font-size="13" fill="#1b4f72">A branch shares before and prompt.</text>
  <text x="496" y="692" font-size="13" fill="#1b4f72">Each variant directory becomes one unit.</text>
  <path d="M644,652 L644,625" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="990" y="138" width="360" height="54" rx="10" fill="#f1e8f6" stroke="#7d3c98"/>
  <text x="1006" y="159" font-size="13" fill="#5b2c6f">Hidden oracle material stays in expect, shared expect,</text>
  <text x="1006" y="177" font-size="13" fill="#5b2c6f">or judge-only inputs, never target-visible files.</text>
  <path d="M1170,192 L1070,470" stroke="#7d3c98" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="960" y="650" width="390" height="60" rx="10" fill="#f9e7e5" stroke="#c0392b"/>
  <text x="976" y="672" font-size="13" fill="#922b21">HIGH: when files are under test, after/ must exist.</text>
  <text x="976" y="690" font-size="13" fill="#922b21">expect must not restate file outcome.</text>
  <path d="M1040,650 L1040,562" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="28" y="790" width="1384" height="102" rx="12" fill="#fffdf8" stroke="#d8d2c7"/>
  <text x="48" y="820" font-size="14" font-weight="700" fill="#2b2b2b">Legend</text>
  <rect x="130" y="802" width="18" height="18" rx="4" fill="#f9e7e5" stroke="#c0392b"/><text x="156" y="816" font-size="12" fill="#922b21">design-constraint</text>
  <rect x="314" y="802" width="18" height="18" rx="4" fill="#fbeee2" stroke="#d35400"/><text x="340" y="816" font-size="12" fill="#a04000">impl-directive</text>
  <rect x="490" y="802" width="18" height="18" rx="4" fill="#eaf1f8" stroke="#2471a3"/><text x="516" y="816" font-size="12" fill="#1b4f72">behavioral-contract</text>
  <rect x="710" y="802" width="18" height="18" rx="4" fill="#f1e8f6" stroke="#7d3c98"/><text x="736" y="816" font-size="12" fill="#5b2c6f">scope-bound</text>
  <text x="48" y="852" font-size="12" fill="#7a756c">Dashed leaders anchor notes. HIGH marks high salience.</text>
  <text x="48" y="878" font-size="12" fill="#7a756c">SSOT = skillevol-form-eval-structure.yaml; this SVG is a projection.</text>
</svg>
