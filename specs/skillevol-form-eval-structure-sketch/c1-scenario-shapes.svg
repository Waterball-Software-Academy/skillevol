<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"
     font-family="'JetBrains Mono','SF Mono','Menlo','Consolas','PingFang TC','Microsoft JhengHei',monospace">
  <defs>
    <marker id="ink" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 L3,5.5 Z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="960" fill="#fbfaf7"/>

  <text x="36" y="42" font-size="28" font-weight="700" fill="#2b2b2b">c1-scenario-shapes</text>
  <text x="36" y="70" font-size="15" fill="#7a756c">focus: where before, prompt, user, expect, and after live in unit and branch shapes</text>

  <rect x="28" y="100" width="670" height="620" rx="14" fill="none" stroke="#bdb8ad" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="48" y="126" font-size="16" font-weight="700" fill="#8a857a">Single unit</text>
  <rect x="742" y="100" width="670" height="620" rx="14" fill="none" stroke="#bdb8ad" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="762" y="126" font-size="16" font-weight="700" fill="#8a857a">Branch scenario</text>

  <rect x="90" y="180" width="360" height="170" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="112" y="210" font-size="21" font-weight="700" fill="#2b2b2b">non-branch unit dir</text>
  <text x="112" y="244" font-size="13" fill="#2b2b2b">before/</text>
  <text x="112" y="266" font-size="13" fill="#2b2b2b">prompt.md</text>
  <text x="112" y="288" font-size="13" fill="#2b2b2b">user.md?  expect.md  after/?</text>
  <rect x="112" y="314" width="250" height="22" rx="6" fill="#f0ede6"/>
  <text x="122" y="329" font-size="12" fill="#8a857a">unit: rules/structure.md#scenario-non-branch</text>

  <rect x="108" y="432" width="150" height="92" rx="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="126" y="462" font-size="18" font-weight="700" fill="#2b2b2b">before/</text>
  <text x="126" y="488" font-size="12" fill="#2b2b2b">droppable CWD</text>
  <text x="126" y="506" font-size="12" fill="#2b2b2b">diff base</text>

  <rect x="288" y="432" width="150" height="92" rx="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="306" y="462" font-size="18" font-weight="700" fill="#2b2b2b">expect.md</text>
  <text x="306" y="488" font-size="12" fill="#2b2b2b">behavior oracle</text>
  <text x="306" y="506" font-size="12" fill="#2b2b2b">no file diff</text>

  <rect x="468" y="432" width="150" height="92" rx="12" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="486" y="462" font-size="18" font-weight="700" fill="#2b2b2b">after/</text>
  <text x="486" y="488" font-size="12" fill="#2b2b2b">file outcome</text>
  <text x="486" y="506" font-size="12" fill="#2b2b2b">real snapshot</text>

  <rect x="800" y="180" width="340" height="160" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="822" y="210" font-size="21" font-weight="700" fill="#2b2b2b">branch scenario dir</text>
  <text x="822" y="244" font-size="13" fill="#2b2b2b">before/</text>
  <text x="822" y="266" font-size="13" fill="#2b2b2b">prompt.md</text>
  <text x="822" y="288" font-size="13" fill="#2b2b2b">variants/&lt;unit-name&gt;+</text>
  <rect x="822" y="304" width="230" height="22" rx="6" fill="#f0ede6"/>
  <text x="832" y="319" font-size="12" fill="#8a857a">unit: rules/structure.md#scenario-branch</text>

  <rect x="1188" y="186" width="6" height="148" rx="2" fill="#ddd7ca"/>
  <rect x="1170" y="196" width="210" height="146" rx="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="1164" y="190" width="210" height="146" rx="14" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="1158" y="184" width="210" height="146" rx="14" fill="none" stroke="#2b2b2b" stroke-width="2"/>
  <text x="1184" y="214" font-size="20" font-weight="700" fill="#2b2b2b">variant unit</text>
  <text x="1184" y="248" font-size="13" fill="#2b2b2b">user.md</text>
  <text x="1184" y="270" font-size="13" fill="#2b2b2b">expect.md</text>
  <text x="1184" y="292" font-size="13" fill="#2b2b2b">after/</text>
  <rect x="1184" y="306" width="190" height="22" rx="6" fill="#f0ede6"/>
  <text x="1194" y="321" font-size="12" fill="#8a857a">unit: rules/structure.md#variant-unit</text>

  <path d="M184,432 L184,350" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <path d="M364,432 L364,350" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <path d="M544,432 L544,350" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="202" y="392" font-size="12" fill="#2b2b2b">drop as CWD</text>
  <text x="382" y="392" font-size="12" fill="#2b2b2b">record behavior</text>
  <text x="500" y="392" font-size="12" fill="#2b2b2b">imply outcome</text>

  <path d="M1140,260 L1158,260" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ink)"/>
  <text x="964" y="248" font-size="12" fill="#2b2b2b">each variant becomes one unit</text>

  <rect x="52" y="552" width="450" height="60" rx="10" fill="#eaf1f8" stroke="#2471a3"/>
  <text x="68" y="574" font-size="13" fill="#1b4f72">E1 and E2: every unit must run after dropping before/.</text>
  <text x="68" y="592" font-size="13" fill="#1b4f72">before/ is both CWD and diff base.</text>
  <path d="M280,552 L270,350" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="536" y="552" width="340" height="60" rx="10" fill="#fbeee2" stroke="#d35400"/>
  <text x="552" y="574" font-size="13" fill="#a04000">expect only carries process and rubric.</text>
  <text x="552" y="592" font-size="13" fill="#a04000">Do not add file diff or outcome prose.</text>
  <path d="M704,552 L364,524" stroke="#d35400" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="56" y="626" width="420" height="60" rx="10" fill="#f9e7e5" stroke="#c0392b"/>
  <text x="72" y="648" font-size="13" fill="#922b21">HIGH: if files are under test, after/ is required.</text>
  <text x="72" y="666" font-size="13" fill="#922b21">Without after/, only behavior or message may be judged.</text>
  <path d="M454,626 L544,524" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="820" y="384" width="470" height="60" rx="10" fill="#f9e7e5" stroke="#c0392b"/>
  <text x="836" y="406" font-size="13" fill="#922b21">In a branch, before/ and prompt.md are shared once.</text>
  <text x="836" y="424" font-size="13" fill="#922b21">Do not duplicate common input into every variant.</text>
  <path d="M968,384 L968,340" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="930" y="480" width="440" height="60" rx="10" fill="#eaf1f8" stroke="#2471a3"/>
  <text x="946" y="502" font-size="13" fill="#1b4f72">Each variant is one input-to-output point:</text>
  <text x="946" y="520" font-size="13" fill="#1b4f72">user.md, expect.md, and after/ are paired together.</text>
  <path d="M1150,480 L1264,330" stroke="#2471a3" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect x="28" y="790" width="1384" height="102" rx="12" fill="#fffdf8" stroke="#d8d2c7"/>
  <text x="48" y="820" font-size="14" font-weight="700" fill="#2b2b2b">Legend</text>
  <rect x="130" y="802" width="18" height="18" rx="4" fill="#f9e7e5" stroke="#c0392b"/><text x="156" y="816" font-size="12" fill="#922b21">design-constraint</text>
  <rect x="314" y="802" width="18" height="18" rx="4" fill="#fbeee2" stroke="#d35400"/><text x="340" y="816" font-size="12" fill="#a04000">impl-directive</text>
  <rect x="490" y="802" width="18" height="18" rx="4" fill="#eaf1f8" stroke="#2471a3"/><text x="516" y="816" font-size="12" fill="#1b4f72">behavioral-contract</text>
  <text x="48" y="852" font-size="12" fill="#7a756c">Stacked cards mean multiplicity N. HIGH marks high salience.</text>
  <text x="48" y="878" font-size="12" fill="#7a756c">SSOT = skillevol-form-eval-structure.yaml; this SVG is a projection.</text>
</svg>
